# =============================================================================
# Federated Learning Experiment Configuration
# Placeholders in {braces} are filled in by the experiment runner.
# =============================================================================

# --- Experiment Metadata ---------------------------------------------------
experiment_name: "{attack}_{defense}_{dataset}_{flow}"

# --- FL Parameters ---------------------------------------------------------
flow: "{flow}"                    # centralized | decentralized
dataset: "{dataset}"
num_clients: 20
num_parallel_clients: 20          # >1 = parallel training, 1 = serial training
client_selection_fraction: 1.0    # centralized: fraction of clients; decentralized: all (num_clients)
num_rounds: 100
local_epochs: 5
iid: "dirichlet"                  # data partitioning scheme
dirichlet_alpha: 0.5
batch_size: 32
test_batch_size: 256
lr: 0.01
seed: 42
mix_ratio: 0.5
net_churn_rho: 0.0

# --- Checkpointing ---------------------------------------------------------
#pretrained_path: experiments/models/neurotoxin_saga_nslkdd_decentralized_30_non_iid.pth
#start_round: 31
save_model: false
save_model_path: "experiments/models/{attack}_{defense}_{dataset}_{flow}.pth"
save_model_rounds: [30, 60, 100]


# --- Statistics Logging ------------------------------------------------------
save_statistics: false
statistic_analysis_path: "experiments/statistics/{attack}_{defense}_{dataset}_{flow}.pkl"
statistic_analysis_rounds: 35


# --- Training Attack Parameters --------------------------------------------
attack: "{attack}"                # none | badnets | scaling | neurotoxin | a3fl | dba | iba
num_malicious: 3
malicious_strategy: "random"      # random | first (first = clustered)
target_class: 0                   # 1 for HAR; 0: "normal" for NSLKDD and UNSW-NB15; 7: "speed limit" for GTSRB; 7: for other CV datasets
                                  # if the target class is common in the clean data, the ASR may be high
                                   
poisoning_rate: 0.25
attack_start_round: 30
attack_end_round: 50             # scaling (one-shot): start == end; BadNets (whole training): -1
attack_mode: "continuous"         # continuous | sporadic

# --- Aggregation Attack Parameters -----------------------------------------
attack_type: "biased_mix"     # scale_update | biased_mix | align_neighbor
                                  # scale_update: scale the malicious update to maximize its impact on the global model
                                  # biased_mix: mix malicious updates with benign updates to bias the aggregation
                                  # align_neighbor: align the pre train malicious update with a specific neighbor's update
biased_mix_ratio: 0.5
target_neighbor: false            # align the post train neurotoxin attack with a specific previous neighbor (true) or own previous (false)
scale: 2.0
stealth_after: 40
stealth_ratio: 0.9

# --- Attack-specific Parameters --------------------------------------------
scale_factor: 2.0
malicious_epochs: 10
mask_k_percent: 0.05
trigger_epochs: 10
trigger_lr: 0.005

omp_gamma_init: 2.0
omp_tau: 1.0e-3
omp_perturbation: "sign"

# --- Defense Parameters ----------------------------------------------------
defense: "{defense}"

# Defense-specific parameters
clipping_norm: 4.0                # Default median
dp_std_dev: 0.01                  # Weak DP noise

deepsight_num_samples: 256
deepsight_num_seeds: 3
deepsight_batch_size: 64
deepsight_tau: 0.5

flame_lambda: 0.00001             # 0.001 hurts convergence; 0.0005 hurts on CIFAR-10;
                                  # small values give higher ASR but better ACC on other datasets
flame_eta: 1.0

krum_f: 2
krum_m: 3                         # 3 for the 20-client case; adjust for larger numbers of clients

trim_b: 2                         # 2 for the 20-client case; adjust for larger numbers of clients

balance_gamma: 0.5                # 0.3 is the reference default but did not work here
balance_kappa: 1.0                # 1-4 is the reference range, but too strict
balance_variant: "exp_decay"      # exp_decay | adaptive
balance_weighted: false

ubar_rho: 0.45
ubar_batch_size: 128               # batch size for UBAR's loss-based evaluation;

spp_fraction: 0.5
spp_fixed_count: null
spp_metric: "cosine"              # cosine | combined
spp_combined_weights: null        # e.g. {cosine: 0.3, l2: 0.7}
spp_threshold: 0.9                # if unset, relative acceptance mode is used
spp_seed: 1234

mm_p: 0.5
mm_whiten: true
mm_min_clients: 4                 # minimum number of clients required for the MMAD defense
mm_eps: 1.0e-6
mm_metrics: ["manhattan", "euclidean", "cosine"]

dfldual_alpha: 1.0
dfldual_C1: 1.0e+6
dfldual_C2: 10

abalance_gamma: 0.1               # smoothing
abalance_tau: 1.0                 # early benign acceptance

sentinel_tau_s: 0.5               # similarity threshold; default is median - mad
sentinel_mad_k: 2.0               # MAD multiplier for outlier cutoff
sentinel_bootstrap_min: 300       # minimum samples/steps before the filter activates

# --- Topology / Graph Configuration ----------------------------------------
# Provide either a single topology (mode: single) or a list to sweep over
# (mode: sweep); the harness iterates over each sweep entry.
topology:
  mode: "single"                  # single | sweep

  # Used when mode == "single"
  single:
    name: "random_regular"        # friendly name for logs / filenames
    type: "random_regular"        # random | ring | line | cycle | erdos_renyi |
                                  # watts_strogatz | barabasi_albert |
                                  # random_regular | random_regular_nx | custom
    n: 20                         # number of nodes (overrides num_clients if provided)
    k: 7                          # target degree (best-effort)
    seed: 42

    # Type-specific parameters
    params:
      p: 0.24                     # erdos_renyi (0.08 also tried)
      beta: 0.1                   # watts_strogatz
      force_k_even: true          # watts_strogatz: enforce even k
      m: 2                        # barabasi_albert
      use_networkx_random_regular: false   # random_regular: use the NetworkX implementation
      custom_path: null           # custom: adjacency file (json/yaml/gml), relative to experiment dir

    # Connectivity / post-processing
    ensure_connected: true        # if false, disconnected graphs are accepted (spectral gap 0)
    max_additional_edge_attempts: 5000   # attempts to reach k if needed

    # Outputs
    save_graph_as: "adj"          # adj = adjacency dict (yaml/json) | gml = NetworkX GML
    compute_metrics: true
    metrics_to_compute:
      - algebraic_connectivity
      - diameter
      - avg_shortest_path_length
      - average_clustering

    # Spectral-gap targeting (optional)
    spectral_gap:
      target: null                # float target; null to skip
      approx_search: false        # true = heuristic search (samples x tries_per_sample)
      param_bounds: [0.0, 1.0]    # search bounds (e.g. for p or beta)
      samples: 30
      tries_per_sample: 3
      stop_if_within: 0.01        # stop early when within this absolute error

    # Reproducible multi-instance runs
    instances: 1
    annotate_instance_id: true    # add instance id to output filenames

  # Used when mode == "sweep"
  sweep:
    - name: "ws_beta_sweep"
      type: "watts_strogatz"
      n: 10
      k: 6
      seed: 0
      params:
        beta: null                # replaced by values from sweep_over
      sweep_over:
        param: "beta"
        values: [0.0, 0.01, 0.05, 0.1, 0.2, 0.4]
      instances_per_value: 5
      compute_metrics: true

    - name: "er_p_sweep"
      type: "erdos_renyi"
      n: 10
      k: 6
      seed: 1
      params:
        p: null                   # replaced by values from sweep_over
      sweep_over:
        param: "p"
        values: [0.02, 0.04, 0.06, 0.08, 0.12]
      instances_per_value: 10
      compute_metrics: true

  # Fallbacks for fields missing in single/sweep entries
  defaults:
    ensure_connected: true
    compute_metrics: true
    instances: 1

# --- Hardware --------------------------------------------------------------
device: "cuda"